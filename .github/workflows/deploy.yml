name: Static Site Deployment

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'Automated GitHub Pages Deployment PR')
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub Status
        uses: crazy-max/ghaction-github-status@v3

      - name: Clean previous runs
        uses: styfle/cancel-workflow-action@0.5.0
        with:
          access_token: ${{ github.token }}

      - name: Extract Branch Name From The Triggering PR
        id: extract_branch
        run: |
          # Extract the branch name from the GITHUB_HEAD_REF or GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Original PR Branch Name: $branch_name"

          # Remove the date portion from the branch name
          branch_name_without_date=$(echo "$branch_name" | sed -E 's/-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$//')
          echo "PR Branch Name Without Date: $branch_name_without_date"

          # Set the output for the branch name without the date
          echo "branch_name=$branch_name_without_date" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.extract_branch.outputs.branch_name }}

      - name: Authenticate NPM for Package Install
        uses: ./.github/actions/npm-login
        with:
          user: ${{ secrets.NPM_USER }}
          token: ${{ secrets.NPM_TOKEN }}
          email: ${{ secrets.NPM_EMAIL }}
          npmrc_path: ~/.npmrc

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm install

      - name: Build
        run: npm run build

      - name: Extract Deployment Name from HTML File
        id: extract_deployment_name
        run: |
          FILE_PATH="multiDeployment/index.html"
          DEPLOYMENT_NAME=$(tac $FILE_PATH | grep -oP '(?<=<a href="/).+?(?=/index.html">)' | head -n 1)
          echo "Extracted Deployment Name: $DEPLOYMENT_NAME"
          echo "deployment_name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Deploy GitHub Pages New MultiDeployment HTML Page
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./multiDeployment
          exclude_assets: ".github,node_modules"
          keep_files: true

      - name: Wait for 2 minutes
        run: sleep 120
        shell: bash

      - name: Deploy GitHub Pages site
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/saffron-angular-example
          exclude_assets: ".github,node_modules"
          destination_dir: ${{ steps.extract_deployment_name.outputs.deployment_name }}

      - name: Extract PR Number from Body
        id: extract_pr_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body;
            const prNumber = body.trim(); // Trim any whitespace
            if (!/^\d+$/.test(prNumber)) {
              throw new Error('Invalid PR number found in the body.');
            }
            console.log(`Extracted PR Number: ${prNumber}`);
            core.exportVariable('pr_number', prNumber);
            return { pr_number: prNumber };

      - name: Add comment to original PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.pr_number;
            console.log(`The PR number is ${prNumber}`);
            console.log(`The PR number is ${process.env}`);
            const deploymentName = '${{ steps.extract_deployment_name.outputs.deployment_name }}';
            const comment = `Deployment completed successfully for PR #${prNumber}. You can view the deployment [here](https://literate-lamp-0c2b51fe.pages.github.io/${deploymentName}/index.html).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });