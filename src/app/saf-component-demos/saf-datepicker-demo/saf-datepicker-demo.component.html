<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="datepicker">Datepicker</h3>
    <saf-anchor href="#datepicker">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Simple Date Picker -->
  <div class="Component-heading">
    <h4 id="datepicker-simple-date-picker">Simple Date Picker</h4>
    <saf-anchor href="#datepicker-simple-date-picker"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div style="display: block; width: 356px">
      <saf-date-picker
        id="simple-date-picker-component"
        label="Label"
        instructional-text="MM/DD/YYYY"
        optional-text="Optional Text"
        open-picker-aria-label="Open Calendar"
        prev-month-aria-label="Previous Month"
        next-month-aria-label="Next Month"
        month-select-aria-label="Month"
        year-select-aria-label="Year"
      />
    </div>
  </div>

  <!-- Custom Date Format -->
  <div class="Component-heading">
    <h4 id="datepicker-custom-date-format">Custom Date Format</h4>
    <saf-anchor href="#datepicker-custom-date-format"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div style="display: block; width: 356px">
      <saf-date-picker
        required="true"
        label="Label"
        format="yyyy-MM-dd"
        instructional-text="YYYY-MM-DD"
        id="custom-date-format-component"
      />
    </div>
  </div>

  <!-- Min Max Date Range -->
  <div class="Component-heading">
    <h4 id="datepicker-min-max-date-range">Min Max Date Range</h4>
    <saf-anchor href="#datepicker-min-max-date-range"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div style="display: block; width: 356px">
      <saf-date-picker
        id="min-max-date-range-component"
        label="Label"
        format="yyyy-MM-dd"
        min-date="2024-11-12"
        max-date="2025-12-31"
        optional-text="Select dates between 2024-11-12/2025-12-31"
        instructional-text="MM-DD-YYYY"
        locale="en-US"
      />
    </div>
  </div>

  <!-- Disable Dates -->
  <div class="Component-heading">
    <h4 id="datepicker-disabled-dates">Disabled Dates</h4>
    <saf-anchor href="#datepicker-disabled-dates"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div style="display: block; width: 356px">
      <saf-date-picker
        id="disabled-dates-component"
        label="Label"
        format="MM/dd/yyyy"
        instructional-text="MM/DD/YYYY"
        locale="en-US"
        [getDateDisabled]="this.disableDates"
      />
    </div>
  </div>

  <!-- Validation Message -->
  <div class="Component-heading">
    <h4 id="datepicker-validation-message">Validation Message</h4>
    <saf-anchor href="#datepicker-validation-message"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div style="display: block; width: 356px">
      <saf-date-picker
        id="min-max-date-range-component-error"
        label="Label"
        [invalid]="validationMessageData.error.invalid"
        [required]="validationMessageData.error.required"
        [validationMessage]="validationMessageData.error.validationMessage"
        [value]="validationMessageData.error.value"
        (change)="validationMessageData.error.onChange($event)"
      />
      <saf-date-picker
        id="min-max-date-range-component-success"
        label="Label"
        validationMessage="Date is correct"
        [isSuccess]="validationMessageData.success.isSuccess"
        [validationMessage]="validationMessageData.success.validationMessage"
        [required]="validationMessageData.success.required"
        [value]="validationMessageData.success.value"
        (change)="validationMessageData.success.onChange($event)"
      />
    </div>
  </div>
</section>
