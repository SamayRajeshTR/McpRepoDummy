<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <!-- Template for component demos - replace all Component name with your component -->
  <div class="Component-heading">
    <h3 id="message-box">Message box</h3>
    <saf-anchor href="#message-box">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Default -->
  <div class="Component-heading">
    <h4 id="message-box-default">Default</h4>
    <saf-anchor href="#message-box-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-message-box>
      <saf-metadata slot="metadata">
        <saf-metadata-item>TR</saf-metadata-item>
        <saf-metadata-item>
          <time>9:07 a.m. CT</time>
        </saf-metadata-item>
      </saf-metadata>
      Prompt message
    </saf-message-box>
  </div>

  <!-- User response -->
  <div class="Component-heading">
    <h4 id="message-box-user-response">User response</h4>
    <saf-anchor href="#message-box-user-response">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-message-box appearance="user">
      <saf-metadata slot="metadata">
        <saf-metadata-item>TR</saf-metadata-item>
        <saf-metadata-item>
          <time>9:10 a.m. CT</time>
        </saf-metadata-item>
      </saf-metadata>
      Prompt message
    </saf-message-box>
  </div>
</section>
