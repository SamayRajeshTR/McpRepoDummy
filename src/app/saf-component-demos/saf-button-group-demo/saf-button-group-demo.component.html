<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="button-group">Button Group</h3>
    <saf-anchor href="#button-group">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Default -->
  <div class="Component-heading">
    <h4 id="button-group-default">Default</h4>
    <saf-anchor href="#button-group-default"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group aria-label="default button group">
      <saf-button id="secondary-label1" appearance="secondary"
        >Label 1</saf-button
      >
      <saf-button appearance="secondary">Label 2</saf-button>
      <saf-button appearance="secondary">Label 3</saf-button>
      <saf-button appearance="secondary">Label 4</saf-button>
    </saf-button-group>
  </div>

  <!-- Icon only -->
  <div class="Component-heading">
    <h4 id="button-group-icon-only">Icon only</h4>
    <saf-anchor href="#button-group-icon-only"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group aria-label="icon button group">
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="plus" appearance="filled"></saf-icon>
        <saf-sr-only>Add new</saf-sr-only>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="user-pen" appearance="filled">
          <saf-sr-only>Edit user</saf-sr-only>
        </saf-icon></saf-button
      >
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="heart" appearance="filled">
          <saf-sr-only>Favorites</saf-sr-only>
        </saf-icon>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="trash-can" appearance="filled">
          <saf-sr-only>Delete</saf-sr-only>
        </saf-icon></saf-button
      >
    </saf-button-group>
  </div>

  <!-- Compact -->
  <div class="Component-heading">
    <h4 id="button-group-compact-button-group">Compact button group</h4>
    <saf-anchor href="#button-group-compact-button-group"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group aria-label="default button group" density="compact">
      <saf-button appearance="secondary">Label 1</saf-button>
      <saf-button appearance="secondary">Label 2</saf-button>
      <saf-button appearance="secondary">Label 3</saf-button>
      <saf-button appearance="secondary">Label 4</saf-button>
    </saf-button-group>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group aria-label="icon button group" density="compact">
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="plus" appearance="filled"></saf-icon>
        <saf-sr-only>Add new</saf-sr-only>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="user-pen" appearance="filled">
          <saf-sr-only>Edit user</saf-sr-only>
        </saf-icon></saf-button
      >
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="heart" appearance="filled">
          <saf-sr-only>Favorites</saf-sr-only>
        </saf-icon>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="trash-can" appearance="filled">
          <saf-sr-only>Delete</saf-sr-only>
        </saf-icon></saf-button
      >
    </saf-button-group>
  </div>

  <!-- Vertical -->
  <div class="Component-heading">
    <h4 id="button-group-vertical-button-group">Vertical button group</h4>
    <saf-anchor href="#button-group-vertical-button-group"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group aria-label="vertical button group" orientation="vertical">
      <saf-button appearance="secondary">Label 1</saf-button>
      <saf-button appearance="secondary">Label 2</saf-button>
      <saf-button appearance="secondary">Label 3</saf-button>
      <saf-button appearance="secondary">Label 4</saf-button>
    </saf-button-group>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-button-group
      aria-label="vertical icon button group"
      orientation="vertical"
    >
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="plus" appearance="filled"></saf-icon>
        <saf-sr-only>Add new</saf-sr-only>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="user-pen" appearance="filled">
          <saf-sr-only>Edit user</saf-sr-only>
        </saf-icon></saf-button
      >
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="heart" appearance="filled">
          <saf-sr-only>Favorites</saf-sr-only>
        </saf-icon>
      </saf-button>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="trash-can" appearance="filled">
          <saf-sr-only>Delete</saf-sr-only>
        </saf-icon></saf-button
      >
    </saf-button-group>
  </div>
</section>
