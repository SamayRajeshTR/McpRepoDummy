<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="chip">Chip</h3>
    <saf-anchor href="#chip">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-heading">
    <h4 id="chip-overview">Clickable chip</h4>
    <saf-anchor href="#chip-clickable">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-chip
      clickable="true"
      [closeable]="false"
      [closeableTooltip]="false"
      (click)="handleChipClick()"
    >
      Clickable chip
    </saf-chip>
  </div>

  <div class="Component-heading">
    <h4 id="chip-overview">Closeable chip</h4>
    <saf-anchor href="#chip-closeable">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-chip
      [clickable]="false"
      closeable="true"
      closeable-tooltip="true"
      (remove)="handleChipClickClose()"
    >
      Closeable chip
    </saf-chip>
  </div>
  <!-- Closeable Chip Disabled -->
  <div class="Component-heading">
    <h4 id="chip-overview">Closeable chip disabled</h4>
    <saf-anchor href="#chip-closeable-disabled"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-chip
      [clickable]="false"
      closeable="true"
      closeable-tooltip="true"
      disabled="true"
      (remove)="handleChipClickClose()"
    >
      Closeable chip disabled
    </saf-chip>
  </div>

  <!-- Disabled Chip -->
  <div class="Component-heading">
    <h4 id="chip-overview">Disabled chip</h4>
    <saf-anchor href="#chip-disabled">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-chip
      clickable="true"
      [closeable]="false"
      [closeableTooltip]="false"
      disabled="true"
      (click)="handleChipClick()"
    >
      Disabled chip
    </saf-chip>
  </div>

  <!-- Toggle Chip -->

  <div class="Component-heading">
    <h4 id="chip-overview">Toggle chip</h4>
    <saf-anchor href="#chip-toggle">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <saf-chip
      clickable="true"
      [closeable]="false"
      [closeableTooltip]="false"
      (click)="toggleAriaPressed()"
      [attr.aria-pressed]="ariaPressed"
    >
      Toggle chip
    </saf-chip>
  </div>
</section>
