<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="progress-title">Progress</h3>
    <saf-anchor href="#progress">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Default -->
  <div class="Component-heading">
    <h4 id="progress-default">Default</h4>
    <saf-anchor href="#progress-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-progress
      data-testid="progressbar"
      min="0"
      max="100"
      value="60"
      aria-valuenow="0"
      aria-valuemin="0"
      aria-valuemax="100"
      [indeterminate]="false"
    ></saf-progress>
  </div>

  <!-- Indeterminate -->
  <div class="Component-heading">
    <h4 id="progress-indeterminate">Indeterminate</h4>
    <saf-anchor href="#progress-indeterminate">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-progress
      class="p-progressbar-indeterminate-value"
      min="0"
      max="100"
      aria-valuemin="0"
      aria-valuemax="100"
      indeterminate="true"
    ></saf-progress>
  </div>

  <!-- Paused -->
  <div class="Component-heading">
    <h4 id="progress-paused">Paused</h4>
    <saf-anchor href="#progress-paused">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-progress
      class="p-progressbar-paused-value"
      paused=""
      min="0"
      max="100"
      value="50"
      aria-valuenow="50"
      aria-valuemin="0"
      aria-valuemax="100"
      [indeterminate]="false"
    ></saf-progress>
  </div>
</section>
