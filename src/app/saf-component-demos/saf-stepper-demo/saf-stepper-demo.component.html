<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="stepper">Stepper</h3>
    <saf-anchor href="#stepper">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-heading">
    <h3 id="stepper-default">Default</h3>
    <saf-anchor href="#stepper-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-stepper orientation="horizontal">
      <saf-step status="completed">
        <div>Step description 1</div>
      </saf-step>
      <saf-step status="active">
        <div>Step description 2</div>
      </saf-step>
      <saf-step status="inactive">
        <div>Step description 3</div>
      </saf-step>
    </saf-stepper>
  </div>
  <div class="Component-heading">
    <h3 id="stepper-vertical">Vertical</h3>
    <saf-anchor href="#stepper-vertical">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-stepper orientation="vertical" [observeResize]="false">
      <saf-step status="completed">
        <div>Step description 1</div>
      </saf-step>
      <saf-step status="active">
        <div>Step description 2</div>
      </saf-step>
      <saf-step status="inactive">
        <div>Step description 3</div>
      </saf-step>
    </saf-stepper>
  </div>
</section>
