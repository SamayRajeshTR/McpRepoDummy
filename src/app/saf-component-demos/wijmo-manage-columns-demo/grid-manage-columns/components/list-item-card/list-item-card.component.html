<div
  (cdkDragReleased)="onCdkDragDropped()"
  (cdkDragStarted)="handleDragStarted()"
  cdkDrag
  class="drag-box"
  id="drag-container-{{ id }}"
  >
  <saf-button
    [disabled]="!isTooltipVisible"
    id="anchor-show-bottom{{ id }}"
    cdkDragHandle
    class="drag-button"
    appearance="tertiary"
    a11y-aria-description="Press space bar or enter to start moving columns"
    (click)="handleMoveButton()"
    >
    <span style="position: absolute; color: transparent">
      Move {{ currentItem || "Item" }}
    </span>
    <saf-icon
      icon-name="arrows-up-down-left-right"
      appearance="filled"
      presentation
      />
    </saf-button>
    <saf-tooltip
      [hidden]="!isTooltipVisible"
      anchor="anchor-show-bottom{{ id }}"
      placement="bottom"
      >
      Move Column
    </saf-tooltip>

    <app-combobox-wrapper
      #comboboxWrapper
      [inactiveColumns]="inactiveColumns"
      [amountOfItems]="totalItems"
      id="{{ id }}"
      style="width: 100%"
      />
      <saf-tooltip
        anchor="remove-button-{{ id }}"
        id="tooltip-remove-button-{{ id }}"
        placement="bottom"
        >
        Remove Column
      </saf-tooltip>
      <saf-button
        class="remove-button"
        appearance="secondary"
        icon-only
        id="remove-button-{{ id }}"
        ngbDropdownToggle
        aria-controls="menu-action_{{ id + 1 }}"
        [disabled]="totalItems === 1"
        [attr.a11y-aria-label]="'Remove ' + (currentItem || 'Item') + ' column'"
        (click)="handleRemoveColumn()"
        [attr.aria-label]="'Remove ' + (currentItem || 'Item') + ' column'"
        >
        <span style="position: absolute; color: transparent">
          Remove {{ currentItem || "Item" }}
        </span>
        <saf-icon icon-name="xmark" appearance="filled"></saf-icon>
      </saf-button>

      <saf-tooltip anchor="button-menu-trigger{{ id }}" placement="bottom">
        Menu Button
      </saf-tooltip>
      <saf-button
        id="button-menu-trigger{{ id }}"
        [attr.aria-expanded]="overlayOpen === cIndex ? 'true' : 'false'"
        aria-controls="button-menu-overlay-{{ id }}"
        aria-haspopup="true"
        appearance="tertiary"
        class="trigger-button"
        icon-only
        a11y-aria-label="Column Actions"
        (click)="openOverlay()"
        (keydown)="handleTriggerKeydown($event)"
        >
        <saf-icon
          size="20"
          icon-name="ellipsis-vertical"
          appearance="filled"
        ></saf-icon>
      </saf-button>
      <saf-anchored-region
        [attr.hidden]="overlayOpen === cIndex ? null : true"
        id="button-menu-trigger-a{{ id }}"
        anchor="button-menu-trigger{{ id }}"
        class="region"
        vertical-default-position="bottom"
        horizontal-default-position="start"
        horizontal-inset="true"
        horizontal-scaling="content"
        horizontal-positioning-mode="locktodefault"
        vertical-scaling="content"
        vertical-positioning-mode="locktodefault"
        >
        <saf-menu #overlayMenu id="button-menu-overlay-{{ id }}" role="menu">
          @if (cIndex !== 0) {
            <saf-menu-item
              role="menuitem"
              (click)="handleMoveUp()"
              (keydown)="moveUpKeydown($event)"
              >
              Move up
            </saf-menu-item>
          }
          @if (cIndex !== totalItems - 1) {
            <saf-menu-item
              role="menuitem"
              (click)="handleMoveDown()"
              (keydown)="moveDownKeydown($event)"
              >
              Move down
            </saf-menu-item>
          }
          @if (totalItems < allColumns.length) {
            <saf-menu-item
              role="menuitem"
              (click)="handleInsertAbove()"
              (keydown)="insertAboveKeydown($event)"
              >
              Insert above
            </saf-menu-item>
          }
          @if (totalItems < allColumns.length) {
            <saf-menu-item
              role="menuitem"
              (click)="handleInsertBelow()"
              (keydown)="insertBelowKeydown($event)"
              >
              Insert below
            </saf-menu-item>
          }
        </saf-menu>
      </saf-anchored-region>
    </div>
