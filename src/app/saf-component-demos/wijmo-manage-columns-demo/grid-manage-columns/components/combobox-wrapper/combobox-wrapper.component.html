<saf-combobox
  #comboboxRef
  data-currentidx="{{ id }}"
  id="combobox-{{ id }}"
  density="inherit"
  [isSuccess]="false"
  [value]="currentItem"
  (change)="handleChange($event)"
  (input)="handleChange($event)"
  (focusin)="handleFocusIn()"
  (click)="handleClickOrFocus()"
  class="drag-content"
  [invalid]="isInvalid"
  [attr.browser-autocomplete]="'off'"
  validation-message="Column not found. Check spelling and try again."
  [placeholder]="currentItem || ''"
  (focusout)="handleFocusOut($event)"
  (keydown)="handleKeydown($event)"
  [searchOffline]="false"
  [clearable]="false"
  [multiple]="false"
>
  <saf-option
    class="header-dropdown-option-flex"
    *ngFor="let column of inactiveColumns; index as i"
    [value]="column"
  >
    {{ column }}
  </saf-option>
</saf-combobox>
