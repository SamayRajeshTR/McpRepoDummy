@if (showRevertDialog) {
  <ng-template appBodyPortal>
    <saf-dialog
      class="restore-dialog"
      dialog-title="Restore defaults?"
      id="revert-changes-dialog"
      modal="true"
      is-footer="true"
      is-header="true"
      is-alert="true"
      [open]="true"
      (close)="handleCancelRevertDialogClick()"
      >
      <saf-alert appearance="warning" hide-close-button style="margin: 0">
        This will discard your current selection and reset the list.
      </saf-alert>
      <div
        slot="footer"
        style="display: flex; justify-content: flex-end; gap: 12px"
        >
        <div>
          <saf-button
            id="dialog-go-back"
            appearance="secondary"
            (click)="handleCancelRevertDialogClick()"
            >
            No, go back
          </saf-button>
        </div>
        <saf-button
          appearance="primary"
          style="margin: 0"
          (click)="handleRestoreDefaults()"
          >
          Restore defaults
        </saf-button>
      </div>
    </saf-dialog>
  </ng-template>
}
<ng-template appBodyPortal>
<saf-drawer
    #drawer
    id="overview"
    modal="true"
    is-header="true"
    is-footer="true"
    [noFocusTrap]="false"
    drawer-title="Columns"
    drawer-subtitle="Add, remove, or reorder columns in the table."
    placement="right"
    close-aria-label="Close"
    class="drawer-container"
    (close)="onMangeDrawerClose()"
    (keydown)="keydown$.next($event)"
    tabIndex="0"
    >
    <div slot="subheader" class="add-column-button">
      <saf-button
        appearance="secondary"
        [disabled]="items.length >= allColumns.length"
        [attr.density]="'inherit'"
        (click)="addColumn()"
        >
        <saf-icon slot="start" icon-name="plus" appearance="outline"></saf-icon>
        Add column
      </saf-button>
    </div>
    <div
      cdkDropList
      class="column-list mt-20 pt-3"
      (cdkDropListDropped)="listDrop$.next($event)"
      >
      <ol class="manageColumns-rowfields">
        @for (column of (columns$ | async); track column; let i = $index) {
          <li
            aria-pressed="false"
            class="manageColumns-rowfields-item"
            role="listitem"
            >
            <div class="drag-item">
              <div class="drag-index">
                <span class="index">{{ i + 1 + "." }}</span>
              </div>
              <saf-wijmo-list-item-card
                #listItemCard
                style="width: 100%"
                (insertAbove)="onInsertAbove(column.id, i)"
                (insertBelow)="onInsertBelow(column.id, i)"
                [inactiveColumns]="inactiveColumns"
                (dragItem)="onDragItem($event)"
                [columnsListActive]="items"
                [columnsListInactive]="inactiveColumns"
                [overlayOpen]="overlayOpen"
                (setOverlay)="openOverlay(i)"
                (closeOverlay)="openOverlay(-1)"
                (moveDown)="onMoveDown(column.id)"
                (moveUp)="onMoveUp(column.id)"
                (removeColumn)="removeColumn(column.id, i)"
                [cIndex]="i"
                [id]="column.id"
                [isTooltipVisible]="isTooltipVisible || i === dragItemId"
                (moveButton)="handleMoveButton($event)"
                />
              </div>
            </li>
          }
        </ol>
        <app-accessibility [announce]="currentAnnounce" />
      </div>
      <div class="manager-footer" slot="footer">
        <saf-button
          id="restore-defaults-button"
          appearance="tertiary"
          [attr.density]="'inherit'"
          (click)="revertChanges()"
          >
          <saf-icon
            slot="start"
            icon-name="arrow-rotate-left"
            appearance="outline"
          ></saf-icon>
          Restore defaults
        </saf-button>
        <saf-button
          appearance="secondary"
          [attr.density]="'inherit'"
          (click)="onMangeDrawerClose()"
          >
          Cancel
        </saf-button>
        <saf-button
          id="apply-button"
          appearance="primary"
          [attr.density]="'inherit'"
          (click)="applyChanges()"
          >
          Apply
        </saf-button>
      </div>
    </saf-drawer>
</ng-template>
