<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="divider-title">Faceted Filter</h3>
    <saf-anchor href="#faceted-filter">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Vertical -->
  <div class="Component-heading">
    <h4 id="faceted-filter-default">Default</h4>
    <saf-anchor href="#faceted-filter-default"><app-link-icon></app-link-icon></saf-anchor>
  </div>
  <div class="Component-demo">
    <div class="Component-container">
      <saf-faceted-filter
        id="faceted-filter"
        filter-title="Filter title"
        filter-subtitle="Filter by:"
        instructional-text="Select a filter to narrow results"
        >
        <saf-facet-category id="acme" summary="Fats">
          <saf-facet-item
            id="overview"
            [checked]="false"
            [expanded]="false"
            [disabled]="false"
            aria-expanded="false"
            facet-name="Oils"
            item-count="100"
            >
            @for (item of items; track item) {
              <saf-facet-item
                [id]="item.id"
                [checked]="false"
                [expanded]="false"
                [disabled]="false"
                aria-expanded="false"
                [attr.facet-name]="item.name"
                [attr.item-count]="item.count"
                >
              </saf-facet-item>
            }
          </saf-facet-item>
        </saf-facet-category>
        <saf-facet-category id="thingy" summary="Carbs">
          <saf-facet-item
            id="pasta"
            [checked]="false"
            [expanded]="false"
            [disabled]="false"
            aria-expanded="false"
            facet-name="Pasta"
            item-count="100"
            >
            <saf-facet-item
              id="first-pasta"
              [checked]="false"
              [expanded]="false"
              [disabled]="false"
              aria-expanded="false"
              facet-name="Penne"
              item-count="20"
            ></saf-facet-item>
            <saf-facet-item
              id="second-pasta"
              [checked]="false"
              [expanded]="false"
              [disabled]="false"
              aria-expanded="false"
              facet-name="Rigatoni"
              item-count="30"
            ></saf-facet-item>
            <saf-facet-item
              id="third-pasta"
              [checked]="false"
              [expanded]="false"
              [disabled]="false"
              aria-expanded="false"
              facet-name="Macaroni"
              item-count="5"
            ></saf-facet-item>
          </saf-facet-item>
        </saf-facet-category>
      </saf-faceted-filter>
    </div>
  </div>
  <!-- With counter -->
  <div class="Component-heading">
    <h4 id="faceted-filter-with-counter">With counter</h4>
    <saf-anchor href="#faceted-filter-with-counter"><app-link-icon></app-link-icon></saf-anchor>
  </div>
  <div class="Component-demo">
    <div class="Component-container">
      <saf-faceted-filter
        id="faceted-filter-with-counter"
        filter-title="Filter title"
        filter-subtitle="Filter by:"
        instructional-text="Select a filter to narrow results"
        show-counter-badges
        >
        <saf-facet-category id="fats" summary="Fats">
          <saf-facet-item
            id="overview2"
            checked="true"
            [expanded]="false"
            [disabled]="false"
            aria-expanded="false"
            facet-name="Oils"
            item-count="100"
            >
            @for (item of items; track item) {
              <saf-facet-item
                [id]="item.id + '2'"
                [checked]="false"
                [expanded]="false"
                [disabled]="false"
                aria-expanded="false"
                [attr.facet-name]="item.name"
                [attr.item-count]="item.count"
                >
              </saf-facet-item>
            }
          </saf-facet-item>
        </saf-facet-category>
        <saf-facet-category id="carbs" summary="Carbs">
          @for (item of items; track item) {
            <saf-facet-item
              [id]="item.id + '3'"
              [checked]="false"
              [expanded]="false"
              [disabled]="false"
              aria-expanded="false"
              [attr.facet-name]="item.name"
              [attr.item-count]="item.count"
              >
            </saf-facet-item>
          }
        </saf-facet-category>
      </saf-faceted-filter>
    </div>
  </div>
</section>
