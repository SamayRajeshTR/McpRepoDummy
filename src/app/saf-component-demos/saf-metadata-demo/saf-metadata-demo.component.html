<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <!-- Template for component demos - replace all Component name with your component -->
  <div class="Component-heading">
    <h3 id="metadata">Metadata</h3>
    <saf-anchor href="#metadata">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Default -->
  <div class="Component-heading">
    <h4 id="metadata-default">Default</h4>
    <saf-anchor href="#metadata-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-metadata>
      <saf-metadata-item>TR</saf-metadata-item>
      <saf-metadata-item>
        <time>9:07 a.m. CT</time>
      </saf-metadata-item>
    </saf-metadata>
  </div>

  <!-- Slotted separator -->
  <div class="Component-heading">
    <h4 id="metadata-slotted-separator">Slotted separator</h4>
    <saf-anchor href="#metadata-slotted-separator">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-metadata>
      <saf-metadata-item :separator="${x => x.separator}">
        Metadata Item 1
        <span slot="separator">&bull;</span>
      </saf-metadata-item>
      <saf-metadata-item :separator="${x => x.separator}">
        Metadata Item 2
        <span slot="separator">&bull;</span>
      </saf-metadata-item>
    </saf-metadata>
  </div>
</section>
