<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="switch-title">Switch</h3>
<saf-anchor href="#switch">
  <app-link-icon>
  </app-link-icon>
</saf-anchor>
  </div>
  <div class="Component-demo  Component-demo--centered">
    <saf-switch class="switch-change" id="switch-default" (change)='handleOnSwitchChange(this)' [value]="switchStatus">
      Default
      <span slot="checked-message">On</span>
      <span slot="unchecked-message">Off</span>
    </saf-switch>
    <saf-switch id="switch-checked" checked="true">
      Checked
      <span slot="checked-message">On</span>
      <span slot="unchecked-message">Off</span>
    </saf-switch>
    <saf-switch id="switch-disabled" checked="true" disabled>
      Disabled
      <span slot="checked-message">On</span>
      <span slot="unchecked-message">Off</span>
    </saf-switch>
    <saf-switch  id="switch-readonly" checked="true" readonly>
      Readonly
      <span slot="checked-message">On</span>
      <span slot="unchecked-message">Off</span>
    </saf-switch>
  </div>
  <p class="Component-message">{{ this.switchStatusText }}</p>
</section>
