<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="file-upload-progress-panel">File upload progress panel</h3>
    <saf-anchor href="#file-upload-progress-panel">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Vertical -->
  <div class="Component-heading">
    <h4 id="file-upload-progress-panel-default">Default</h4>
    <saf-anchor href="#file-upload-progress-panel-default"><app-link-icon></app-link-icon></saf-anchor>
  </div>
  <div class="Component-demo">
    <div class="Component-container">
      <saf-file-upload-progress-panel
        heading="Uploads"
        subheading="Uploading 5 files"
        heading-level="4"
        trigger-id="fileUploadClearAll"
      >
        <saf-button id="fileUploadClearAll" slot="clear-action" appearance="secondary">Clear all</saf-button>

        <saf-file-upload-status-item
          filename="Document_name1.doc"
          status="success"
        ></saf-file-upload-status-item>
        <saf-file-upload-status-item
          filename="Document_name2.doc"
          progress="63"
          status="uploading"
        ></saf-file-upload-status-item>
        <saf-file-upload-status-item
          filename="Document_name3.doc"
          progress="60"
          status="paused"
        ></saf-file-upload-status-item>
        <saf-file-upload-status-item filename="Document_name4.doc" status="pending">
          <saf-text slot="end" appearance="body-default-sm">Waiting...</saf-text>
        </saf-file-upload-status-item>
        <saf-file-upload-status-item
          filename="Document_name5.doc"
          status="error"
          error-message="File upload failed. Please try again."
        ></saf-file-upload-status-item>
      </saf-file-upload-progress-panel>
    </div>
  </div>
</section>
