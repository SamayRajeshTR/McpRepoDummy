<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="tooltip">Tooltip</h3>
    <saf-anchor href="#tooltip">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-heading">
    <h4 id="tooltip-all-positions">All Tooltip positions</h4>
    <saf-anchor href="#tooltip-all-positions"
      ><app-link-icon></app-link-icon
    ></saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-tooltip id="tooltip-show-top" anchor="anchor-show-top" placement="top">
      Tooltip top
    </saf-tooltip>
    <saf-button id="anchor-show-top">Top </saf-button>
    <saf-tooltip
      id="tooltip-show-top-start"
      anchor="anchor-show-top-start"
      placement="top-start"
    >
      Tooltip start
    </saf-tooltip>
    <saf-button id="anchor-show-top-start">Top start </saf-button>
    <saf-tooltip
      id="tooltip-show-top-end"
      anchor="anchor-show-top-end"
      placement="top-end"
    >
      Tooltip end
    </saf-tooltip>
    <saf-button id="anchor-show-top-end">Top end </saf-button>
    <saf-tooltip
      id="tooltip-show-bottom"
      anchor="anchor-show-bottom"
      placement="bottom"
    >
      Tooltip bottom
    </saf-tooltip>
    <saf-button id="anchor-show-bottom">Bottom </saf-button>
    <saf-tooltip
      id="tooltip-show-bottom-start"
      anchor="anchor-show-bottom-start"
      placement="bottom-start"
    >
      Tooltip bottom start
    </saf-tooltip>
    <saf-button id="anchor-show-bottom-start">Bottom start </saf-button>
    <saf-tooltip
      id="tooltip-show-bottom-end"
      anchor="anchor-show-bottom-end"
      placement="bottom-end"
    >
      Tooltip bottom end
    </saf-tooltip>
    <saf-button id="anchor-show-bottom-end">Bottom end </saf-button>
    <saf-tooltip
      id="tooltip-show-left"
      anchor="anchor-show-left"
      placement="left"
    >
      Tooltip left
    </saf-tooltip>
    <saf-button id="anchor-show-left">Left </saf-button>
    <saf-tooltip
      id="tooltip-show-right"
      anchor="anchor-show-right"
      placement="right"
    >
      Tooltip right
    </saf-tooltip>
    <saf-button id="anchor-show-right">Right </saf-button>
  </div>
  <div class="Component-heading">
    <h4 id="tooltip-popover">Popover</h4>
    <saf-anchor href="#tooltip-popover">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-anchor href="#tooltip">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 300px;
        width: 300px;
        margin: 0 auto;
      "
    >
      <saf-tooltip
        placement="bottom"
        anchor="anchor-overview"
        trigger-on-click="true"
      >
        Popover bottom
      </saf-tooltip>

      <saf-button id="anchor-overview" a11y-aria-description="Tooltip">
        Overview anchor
      </saf-button>

      <saf-tooltip
        id="tooltip-show-top"
        anchor="anchor-popover-top"
        placement="top"
        trigger-on-click="true"
      >
        Popover top
      </saf-tooltip>
      <saf-button
        id="anchor-popover-top"
        appearance="tertiary"
        density="extra-compact"
        icon-only
      >
        <saf-icon icon-name="info-circle" appearance="filled" presentation>
        </saf-icon>
      </saf-button>
    </div>
  </div>
</section>
