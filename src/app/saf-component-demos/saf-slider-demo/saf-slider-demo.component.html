<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="slider">Slider</h3>
    <saf-anchor href="#slider">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-slider
      [value]="sliderValue"
      (change)="onSliderChange($event)"
      max="10"
      min="0"
      orientation="horizontal"
      step="1"
      id="slider-horizontal-value"
      label="Label"
      instructional-text="Instructional text"
    >
    </saf-slider>
  </div>

  <div class="Component-heading">
    <h4 id="slider-vertical">Slider vertical</h4>
    <saf-anchor href="#slider-vertical">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <saf-slider
      [value]="sliderValue"
      (change)="onSliderChange($event)"
      data-testid="slider-vertical"
      max="10"
      min="0"
      orientation="vertical"
      step="1"
      label="Label"
      instructional-text="Instructional text"
    >
    </saf-slider>
  </div>

  <div class="Component-heading">
    <h4 id="slider-disabled">Slider disabled</h4>
    <saf-anchor href="#slider-disabled">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-slider
      disabled
      data-testid="slider-disabled"
      max="10"
      min="0"
      orientation="horizontal"
      step="1"
      label="Label"
      instructional-text="Instructional text"
    >
    </saf-slider>
  </div>

  <div class="Component-heading">
    <h4 id="slider-label">Slider label</h4>
    <saf-anchor href="#slider-label">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-slider
      [value]="temperature"
      (change)="onTemperatureChange($event)"
      id="slider-label-min"
      max="100"
      min="0"
      orientation="horizontal"
      step="10"
      label="Label"
      instructional-text="Instructional text"
    >
      <saf-slider-label position="0"> 0℃ </saf-slider-label>
      <saf-slider-label position="50"> 50℃ </saf-slider-label>
      <saf-slider-label position="100"> 100℃ </saf-slider-label>
    </saf-slider>
  </div>
</section>
