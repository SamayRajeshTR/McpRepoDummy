<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="button-embedded">Button embedded</h3>
    <saf-anchor href="#button-embedded">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-heading">
    <h4 id="button-embedded-default">Default</h4>
    <saf-anchor href="#button-embedded-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-button-embedded>
      <saf-text-field label="Go to page"></saf-text-field>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="chevron-right"></saf-icon>
        <saf-sr-only>Go</saf-sr-only>
      </saf-button>
    </saf-button-embedded>
  </div>

  <div class="Component-heading">
    <h4 id="button-embedded-compact-button-embedded">
      Compact button embedded
    </h4>
    <saf-anchor href="#button-embedded-compact-button-embedded">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-button-embedded density="compact">
      <saf-text-field label="Go to page"></saf-text-field>
      <saf-button appearance="secondary" icon-only="">
        <saf-icon icon-name="chevron-right"></saf-icon>
        <saf-sr-only>Go</saf-sr-only>
      </saf-button>
    </saf-button-embedded>
  </div>
</section>
