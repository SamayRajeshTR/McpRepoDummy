<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="button-and-menu">Button and menu</h3>
    <saf-anchor href="#button-and-menu">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo">
    <saf-button
      #trigger
      id="button-menu-trigger"
      [attr.aria-expanded]="open ? 'true' : 'false'"
      aria-controls="button-menu-overlay"
      appearance="tertiary"
      a11y-aria-label="User profile"
      (click)="clickHandler()"
      (keydown)="handleTriggerKeydown($event)"
      ><saf-icon
      slot="end"
      icon-name="chevron-down"
      appearance="filled"
      presentation
    ></saf-icon>
    Add new
  </saf-button>
  <saf-anchored-region
    [attr.hidden]="open ? null : ''"
    anchor="button-menu-trigger"
    class="region"
    vertical-default-position="bottom"
    horizontal-default-position="left"
    [horizontalInset]="false"
    horizontal-scaling="content"
    [verticalInset]="false"
    vertical-scaling="content"
    >
    @if (open) {
      <saf-menu
        id="button-menu-overlay"
        aria-label="My Menu"
        #menu
        >
        @for (item of items; track item) {
          <saf-menu-item
            (click)="closeMenu()"
            (keydown)="handleMenuItemKeydown($event)"
            >{{ item.text }}</saf-menu-item
            >
          }
        </saf-menu>
      }
    </saf-anchored-region>
  </div>
</section>
