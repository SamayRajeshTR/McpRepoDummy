<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="divider-title">Divider</h3>
    <saf-anchor href="#divider">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Horizontal -->
  <div class="Component-heading">
    <h4 id="divider-horizontal">Horizontal</h4>
    <saf-anchor href="#divider-horizontal">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--horizontal">
    <code class="u-inlineBlock">mode=onLight</code>
    <div class="DividerContainer DividerContainer--onLight">
      <saf-divider orientation="horizontal" role="separator"></saf-divider>
    </div>

    <code class="u-inlineBlock">mode=onDark</code>
    <div class="DividerContainer DividerContainer--onDark">
      <saf-divider orientation="horizontal" role="separator"></saf-divider>
    </div>
  </div>

  <!-- Vertical -->
  <div class="Component-heading">
    <h4 id="divider-vertical">Vertical</h4>
    <saf-anchor href="#divider-vertical">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--vertical">
    <div class="Component-container">
      <code class="u-inlineBlock">mode=onLight</code>
      <div class="DividerContainer DividerContainer--onLight">
        <saf-divider orientation="vertical" role="separator"></saf-divider>
      </div>
    </div>
    <div class="Component-container">
      <code class="u-inlineBlock">mode=onDark</code>
      <div class="DividerContainer DividerContainer--onDark">
        <saf-divider orientation="vertical" role="separator"></saf-divider>
      </div>
    </div>
  </div>
</section>
