<saf-chat [loading]="loading">
  <saf-message-box>
    <saf-metadata slot="metadata">
      <saf-metadata-item
        >Thomson Reuters <saf-sr-only>says at</saf-sr-only></saf-metadata-item
      >
      <saf-metadata-item>
        <time>9:07 a.m.</time>
      </saf-metadata-item>
    </saf-metadata>
    <saf-text appearance="heading-xl" density="compact">Welcome, User</saf-text>
    <p>What would you like to do today?</p>
    <p>I can prepare legal research, draft clauses, and summarize documents.</p>
    <p>
      Ask me questions like a trusted colleague or try skills suggested in your
      "Suggested actions" workspace.
    </p>
  </saf-message-box>

  <form slot="footer" (submit)="handleSubmit($event)">
    <saf-button-embedded>
      <saf-text-field
        id="workspace-prompt"
        label="Enter a message"
      ></saf-text-field>
      <saf-form-button appearance="secondary" icon-only="" type="submit">
        <saf-icon icon-name="paper-plane"></saf-icon>
        <saf-sr-only>Send</saf-sr-only>
      </saf-form-button>
    </saf-button-embedded>
  </form>
</saf-chat>
