<saf-theme-provider [attr.mode]="mode">
  <div class="ThemeProviderDemo">
    <div class="ThemeProviderDemo-controls">
      <saf-button
        [attr.appearance]="mode === 'auto' ? 'primary' : 'secondary'"
        (click)="setMode('auto')"
      >
        Auto
      </saf-button>
      <saf-button
        [attr.appearance]="mode === 'light' ? 'primary' : 'secondary'"
        (click)="setMode('light')"
      >
        Light
      </saf-button>
      <saf-button
        [attr.appearance]="mode === 'dark' ? 'primary' : 'secondary'"
        (click)="setMode('dark')"
      >
        Dark
      </saf-button>
    </div>

    <saf-card
      appearance="vertical"
      heading-level="2"
      image-bleed="true"
      density="inherit"
    >
      <img
        slot="media"
        src="https://thomsonreuters.wpenginepowered.com/en-us/wp-content/uploads/sites/20/2022/08/Other-13-800x450.jpeg"
        alt="Landscape mountains"
        loading="eager"
      />
      <saf-badge slot="badge" status="info" attached="">
        <saf-icon
          icon-name="circle-info"
          appearance="filled"
          aria-label="Status"
        ></saf-icon>
        <span>Info</span>
      </saf-badge>
      <div slot="heading">Looks great in every theme</div>
      <p class="ThemeProviderDemo-copy">
        This card's colors come from Saffron tokens themed via
        <code>light-dark()</code>.
      </p>
      <p style="margin: 0">
        Use the <strong>mode</strong> control above to switch between Auto,
        Light, and Dark.
      </p>
    </saf-card>
  </div>
</saf-theme-provider>
