<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="text-field">Text Field</h3>
    <saf-anchor href="#text-field">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-default">Default</h4>
    <saf-anchor href="#textfield-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="text-field"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        name="text-field"
        validation-message="Custom validation message"
        tabindex="0"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-help">Help text</h4>
    <saf-anchor href="#textfield-help">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="text-field-helptip"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        name="text-field"
        validation-message="Custom validation message"
        tabindex="0"
        type="text"
      >
        <saf-button
          density="extra-compact"
          id="anchor-overview"
          slot="label-after"
          icon-only
          appearance="tertiary"
          a11y-aria-label="help details"
        >
          <saf-icon icon-name="info-circle" size="16"> </saf-icon>
        </saf-button>
      </saf-text-field>
      <saf-tooltip
        anchor="anchor-overview"
        trigger-on-click
        placement="bottom-start"
      >
        <div>
          <saf-text appearance="body-default-md">
            Popover content, supplemental to the user's saf-anchors workflow,
            displays on click or tap. The button retains focus. 40 words max.
          </saf-text>
        </div>
      </saf-tooltip>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-disabled">Disabled</h4>
    <saf-anchor href="#textfield-disabled">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="disabled-text-field"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        disabled=""
        name="text-field"
        placeholder="disabled input"
        validation-message="Custom validation message"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-invalid">Invalid</h4>
    <saf-anchor href="#textfield-invalid">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="invalid-text-field"
        invalid="true"
        label="Label"
        instructional-text="Instructional text"
        name="text-field"
        placeholder="invalid data"
        validation-message="This is the invalid state"
        tabindex="0"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-password">Password</h4>
    <saf-anchor href="#textfield-password">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="password"
        [invalid]="false"
        label="Password"
        instructional-text="Enter a password between 8 and 16 characters."
        maxlength="16"
        minlength="8"
        name="text-field"
        validation-message="Custom validation message"
        tabindex="0"
        type="password"
        value="password"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-readonly">Read Only</h4>
    <saf-anchor href="#textfield-readonly">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="read-only-text-field"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        readonly=""
        name="text-field"
        validation-message="Custom validation message"
        tabindex="0"
        type="text"
        value="Read only"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-required">Required</h4>
    <saf-anchor href="#textfield-required">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="text-field-required"
        invalid="true"
        label="Label*"
        instructional-text="Instructional text"
        required=""
        name="text-field"
        validation-message="This field is required"
        tabindex="0"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-success">Success</h4>
    <saf-anchor href="#textfield-success">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        id="text-field-success"
        is-success="true"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        name="text-field"
        placeholder="Some kind of valid input"
        validation-message="This is a success state"
        tabindex="0"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="text-field-compact-text-field">Compact text field</h4>
    <saf-anchor href="#text-field-compact-text-field">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <saf-text-field
        density="compact"
        id="text-field-compact"
        [invalid]="false"
        label="Label"
        instructional-text="Instructional text"
        name="text-field"
        validation-message="Custom validation message"
        tabindex="0"
        type="text"
      >
      </saf-text-field>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="textfield-success">In a form</h4>
    <saf-anchor href="#textfield-in-form">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <div class="Component-demo Component-demo--centered">
    <div class="Component-container">
      <form (submit)="onSubmit($event)" (reset)="onReset()">
        <saf-text-field
          #textField
          id="text-field-inform"
          [invalid]="isInvalid"
          label="Label"
          instructional-text="Instructional text"
          name="text-field"
          placeholder="Some kind of valid input"
          [value]
          [attr.validation-message]="validationMessage"
          (change)="onChange()"
          tabindex="0"
          type="text"
          required
        >
        </saf-text-field>

        <div style="margin-top: 24px">
          <saf-form-button type="submit" appearance="primary">Submit</saf-form-button>

          <saf-form-button
            type="reset"
            class="form-cancel-button"
            appearance="secondary"
            (click)="onReset()"
            >Cancel</saf-form-button
          >
        </div>
      </form>
    </div>
  </div>
</section>
