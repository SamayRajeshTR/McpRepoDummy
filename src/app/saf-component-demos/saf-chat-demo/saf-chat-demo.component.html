<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <!-- Template for component demos - replace all Component name with your component -->
  <div class="Component-heading">
    <h3 id="ai-experience">AI Experience</h3>
    <saf-anchor href="#ai-experience">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>

  <!-- Chat -->
  <div class="Component-heading">
    <h4 id="ai-experience-chat">Chat</h4>
    <saf-anchor href="#ai-experience-chat">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <saf-chat>
      <saf-message-box>
        <saf-metadata slot="metadata">
          <saf-metadata-item>Thomson Reuters</saf-metadata-item>
          <saf-metadata-item>
            <time>9:07 a.m. CT</time>
          </saf-metadata-item>
        </saf-metadata>
        Good morning, select a task or enter a prompt to get started
      </saf-message-box>
      <saf-message-box appearance="user">
        <saf-metadata slot="metadata">
          <saf-metadata-item>Full name</saf-metadata-item>
          <saf-metadata-item>
            <time>9:09 a.m. CT</time>
          </saf-metadata-item>
        </saf-metadata>
        I want to...
      </saf-message-box>
      <saf-message-box>
        <saf-progress-text></saf-progress-text>
      </saf-message-box>
      <saf-message-box>
        <saf-metadata slot="metadata">
          <saf-metadata-item>Thomson Reuters</saf-metadata-item>
          <saf-metadata-item>
            <time>9:12 a.m. CT</time>
          </saf-metadata-item>
        </saf-metadata>
        Tell me more about that. Choose from the following topics
      </saf-message-box>
      <saf-message-box appearance="user">
        <saf-metadata slot="metadata">
          <saf-metadata-item>Full name</saf-metadata-item>
          <saf-metadata-item>
            <time>9:12 a.m. CT</time>
          </saf-metadata-item>
        </saf-metadata>
        Topic
      </saf-message-box>
      <div slot="footer">
        <saf-button-embedded>
          <saf-text-field
            id="ai-experience-chat-prompt"
            label="Enter a prompt"
          ></saf-text-field>
          <saf-button appearance="secondary" icon-only="">
            <saf-icon icon-name="paper-plane"></saf-icon>
            <saf-sr-only>Send</saf-sr-only>
          </saf-button>
        </saf-button-embedded>
      </div>
    </saf-chat>
  </div>
</section>
