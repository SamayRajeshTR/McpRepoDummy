<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="text-area">Text area</h3>
    <saf-anchor href="#text-area">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-heading">
    <h4 id="text-area-default">Default</h4>
    <saf-anchor href="#text-area-default">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        id="text-area"
        #selectedValue
        [invalid]="false"
        validation-message="Custom validation message"
        instructional-text="Instructional text"
        optional-text=""
        label="Label"
        (input)="saffronTextarea()"
      >
      </saf-text-area>
      <p>Entered Text: {{ selectedList }}</p>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="text-area-disabled">Disabled</h4>
    <saf-anchor href="#text-area-disabled">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        data-testid="textarea-disabled"
        [invalid]="false"
        validation-message="Custom validation message"
        instructional-text="Instructional text"
        optional-text=""
        label="Label"
        disabled=""
        [isSuccess]="false"
      >
      </saf-text-area>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="text-area-readonly">Readonly</h4>
    <saf-anchor href="#text-area-readonly">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas-readonly"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        id="text-area"
        value="Sample Text"
        [invalid]="false"
        validation-message="Custom validation message"
        instructional-text="Instructional text"
        optional-text=""
        label="Label"
        readonly=""
      >
      </saf-text-area>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="text-area-required">Required</h4>
    <saf-anchor href="#text-area-required">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        id="text-area"
        #selectedValueRequired
        invalid="true"
        validation-message="This field is required"
        instructional-text="Instructional text"
        optional-text=""
        required=""
        label="Label*"
        [isSuccess]="false"
        (input)="saffronTextareaRequired()"
      >
      </saf-text-area>
      <p>Entered Text: {{ selectedListRequired }}</p>
    </div>
  </div>

  <div class="Component-heading">
    <h4 id="text-area-compact-text-area">Compact textarea</h4>
    <saf-anchor href="#text-area-compact-text-area">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        density="compact"
        id="text-area-compact"
        instructional-text="Instructional text"
        label="Label"
      >
      </saf-text-area>
    </div>
  </div>
  <div class="Component-heading">
    <h4 id="text-area-show-remaining-characters">Show remaining characters</h4>
    <saf-anchor href="#text-area-show-remaining-characters">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo Component-demo--centered">
    <div
      id="text-area-demo-canvas"
      style="margin: 0 auto; max-width: 500px; width: calc(100vw - 2rem)"
    >
      <saf-text-area
        id="text-area-remaining-chars"
        instructional-text="Instructional text"
        label="Label"
        maxlength="500"
        show-remaining-text="true"
      >
      </saf-text-area>
    </div>
  </div>
</section>
