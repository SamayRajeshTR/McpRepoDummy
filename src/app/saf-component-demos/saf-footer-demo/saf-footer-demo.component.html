<section class="Component">
  <app-in-page-navigation [links]="inPageLinks" />
  <div class="Component-heading">
    <h3 id="footer">Footer</h3>
    <saf-anchor href="#footer">
      <app-link-icon> </app-link-icon>
    </saf-anchor>
  </div>
  <div class="Component-demo">
    <h4>Default</h4>
    <saf-footer
      product-name="Saffron"
      a11y-aria-label-social-icons="Social Links"
      a11y-aria-label-anchor-group="Footer Links"
    >
      <saf-list
        slot="footer-links"
        size="medium"
        list-style="none"
        order="unordered"
        class="footer-links-list"
        inline="true"
      >
        <saf-list-item>
          <saf-anchor href="#">Terms</saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor href="#">Privacy</saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor href="#">Disclaimer</saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor href="#">Cookies</saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor href="#">Do not sell my information</saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor href="#">Accessibility</saf-anchor>
        </saf-list-item>
      </saf-list>
      <saf-list
        class="footer-social-links"
        slot="footer-social"
        size="medium"
        list-style="none"
        order="unordered"
        inline="true"
      >
        <saf-list-item>
          <saf-anchor
            aria-label="email Thomson Reuters"
            href="mailto:info@thomsonreuters.com"
          >
            <saf-icon
              icon-name="envelope"
              appearance="outline"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor
            aria-label="Thomson Reuters on Facebook"
            href="https://www.facebook.com/thomsonreuters"
          >
            <saf-icon
              icon-name="facebook-f"
              appearance="brands"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor
            aria-label="Thomson Reuters on Instagram"
            href="https://www.instagram.com/thomsonreuters"
          >
            <saf-icon
              icon-name="instagram"
              appearance="brands"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor
            aria-label="Thomson Reuters on LinkedIn"
            href="https://www.linkedin.com/company/thomson-reuters"
          >
            <saf-icon
              icon-name="linkedin-in"
              appearance="brands"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor
            aria-label="Thomson Reuters on Twitter"
            href="https://twitter.com/thomsonreuters"
          >
            <saf-icon
              [presentation]="false"
              alt="Twitter"
              icon-name="twitter"
              appearance="brands"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
        <saf-list-item>
          <saf-anchor
            aria-label="Thomson Reuters on YouTube"
            href="https://www.youtube.com/thomsonreuters"
          >
            <saf-icon
              [presentation]="false"
              alt="YouTube"
              icon-name="youtube"
              appearance="brands"
              color="var(--saf-color-text-strong)"
            ></saf-icon>
          </saf-anchor>
        </saf-list-item>
      </saf-list>
    </saf-footer>
  </div>
</section>
