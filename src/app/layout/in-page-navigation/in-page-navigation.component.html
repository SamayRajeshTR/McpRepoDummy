<nav class="in-page-navigation" aria-labelledby="in-page-nav-heading" role="navigation">
  <h2 class="in-page-navigation-title">
    <saf-text
      appearance="heading-2xl"
      class="title"
      id="in-page-nav-heading"
      role="heading"
      aria-level="2"
    >{{ title }}</saf-text>
  </h2>
  <saf-list size="medium" list-style="disc" order="unordered" role="list">
    @for (link of links; track link.id) {
      <saf-list-item>
        <saf-anchor
          [attr.href]="'#' + link.id"
          [attr.aria-label]="'Navigate to ' + link.label + ' section'"
          (click)="handleAnchorClick($event, link.id)"
        >{{ link.label }}</saf-anchor>
      </saf-list-item>
    }
  </saf-list>
</nav>
